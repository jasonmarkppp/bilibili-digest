<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilibili Digest</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- HEADER -->
    <div class="header">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 18 18"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.73252 2.67094C3.33229 2.28484 3.33229 1.64373 3.73252 1.25764C4.11291 0.890684 4.71552 0.890684 5.09591 1.25764L7.21723 3.30403C7.27749 3.36218 7.32869 3.4261 7.37081 3.49407H10.5789C10.6211 3.4261 10.6723 3.36218 10.7325 3.30403L12.8538 1.25764C13.2342 0.890684 13.8368 0.890684 14.2172 1.25764C14.6175 1.64373 14.6175 2.28484 14.2172 2.67094L13.364 3.49407H14C16.2091 3.49407 18 5.28493 18 7.49407V12.9996C18 15.2087 16.2091 16.9996 14 16.9996H4C1.79086 16.9996 0 15.2087 0 12.9996V7.49406C0 5.28492 1.79086 3.49407 4 3.49407H4.58579L3.73252 2.67094ZM4 5.42343C2.89543 5.42343 2 6.31886 2 7.42343V13.0702C2 14.1748 2.89543 15.0702 4 15.0702H14C15.1046 15.0702 16 14.1748 16 13.0702V7.42343C16 6.31886 15.1046 5.42343 14 5.42343H4ZM5 9.31747C5 8.76519 5.44772 8.31747 6 8.31747C6.55228 8.31747 7 8.76519 7 9.31747V10.2115C7 10.7638 6.55228 11.2115 6 11.2115C5.44772 11.2115 5 10.7638 5 10.2115V9.31747ZM12 8.31747C11.4477 8.31747 11 8.76519 11 9.31747V10.2115C11 10.7638 11.4477 11.2115 12 11.2115C12.5523 11.2115 13 10.7638 13 10.2115V9.31747C13 8.76519 12.5523 8.31747 12 8.31747Z" fill="currentColor"/></svg>
        </div>
        <div class="brand-name">Bilibili Digest</div>
      </div>
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <button
          class="settings-btn"
          id="settingsBtn"
          type="button"
          title="打开设置"
          aria-label="打开设置"
        >
          ⚙ 设置
        </button>
      </div>

      <!-- Tab navigation -->
      <div class="tabs" id="tabsNav" style="display: none">
        <button class="tab active" data-tab="transcript">字幕</button>
        <button class="tab" data-tab="overview">概览</button>
        <button class="tab" data-tab="notes">笔记</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon">&#9655;</div>
        <div class="welcome-title">开始整理视频</div>
        <div class="welcome-desc">
          打开一条带字幕的 B 站视频，点击页面右上角“AI 总结”。
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText">正在获取字幕</div>
          <div class="loading-subtext" id="loadingSubtext">
            正在读取 B 站字幕轨道…
          </div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container">
          <div class="error-icon">&#9888;</div>
          <div class="error-title" id="errorTitle">出现问题</div>
          <div class="error-message" id="errorMessage">
            暂时无法处理这个视频。
          </div>
          <button class="error-btn" id="errorBtn">重新尝试</button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div class="tab-panel active" data-panel="transcript">
          <div class="section">
            <div class="section-header transcript-section-header">
              <div class="transcript-header-main">
                <div class="section-title-wrap">
                  <div class="section-title">完整字幕</div>
                </div>
                <div
                  class="transcript-mode-control"
                  id="transcriptModeControl"
                  role="group"
                  aria-label="Transcript language"
                >
                  <button
                    class="transcript-mode-btn active"
                    type="button"
                    data-transcript-mode="original"
                    aria-pressed="true"
                  >原文</button>
                  <button
                    class="transcript-mode-btn"
                    type="button"
                    data-transcript-mode="zh"
                    aria-pressed="false"
                  >中文</button>
                  <button
                    class="transcript-mode-btn"
                    type="button"
                    data-transcript-mode="bilingual"
                    aria-pressed="false"
                  >双语</button>
                  <span
                    class="translation-spinner"
                    id="langSpinner"
                    aria-label="Translating"
                  ></span>
                </div>
              </div>
              <div class="transcript-actions">
                <button class="enhance-btn feishu-copy-btn" id="copyFeishuBtn">复制到飞书</button>
                <select class="export-format" id="exportFormat" aria-label="导出格式">
                  <option value="md">Markdown</option>
                  <option value="html">HTML 网页</option>
                </select>
                <button class="enhance-btn" id="exportTranscriptBtn">导出</button>
              </div>
            </div>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div class="tab-panel" data-panel="overview">
          <!-- Chapters -->
          <div class="section">
            <div class="section-title">章节时间线</div>
            <ul class="chapter-list" id="chapterList">
              <li
                class="chapter-item"
                style="
                  color: var(--text-muted);
                  cursor: default;
                  border-color: var(--border);
                "
              >
                生成 AI 总结后，章节会显示在这里
              </li>
            </ul>
          </div>

          <!-- Key Quotes -->
          <div class="section">
            <div class="section-title">关键观点</div>
            <div id="quotesList">
              <div
                class="quote-item"
                style="
                  color: var(--text-muted);
                  border-left-color: var(--border);
                  cursor: default;
                "
              >
                <div class="quote-text" style="font-style: normal">
                  打开概览后，将自动提取视频重点…
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div class="tab-panel" data-panel="notes">
          <div class="section">
            <div class="section-header">
              <div class="section-title">已保存笔记</div>
              <div class="notes-filter">
                <button
                  class="enhance-btn active"
                  id="notesFilterThis"
                  aria-pressed="true"
                >
                  当前视频
                </button>
                <button
                  class="enhance-btn"
                  id="notesFilterAll"
                  aria-pressed="false"
                >
                  全部笔记
                </button>
              </div>
            </div>
            <p class="notes-intro" id="notesIntro">
              鼠标移到播放器上点击“笔记”，或在视频获得焦点时按 N 键，保存当前时间点。
            </p>
            <div id="notesList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      style="display: none"
    >
      跟随播放位置
    </button>

    <script src="settings.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
